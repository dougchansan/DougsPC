name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Confirm native search profiles match reviewed manifest
        run: |
          python scripts/device_profiles.py manifests/heritage-001-009.json /tmp/device_profiles.inc
          cmp /tmp/device_profiles.inc 3ds/LegacyBox3DS/source/device_profiles.inc
      - run: python scripts/check_heritage_index.py
      - run: python scripts/check_side_sources.py
      - run: legacybox plan manifests/heritage-smoke.json > /tmp/heritage-plan.json
      - run: legacybox plan manifests/heritage-001-009.json > /tmp/heritage-001-009-plan.json
      - run: legacybox plan manifests/gamecube-smoke.json > /tmp/gamecube-plan.json
      - run: legacybox plan manifests/side-source-smoke.json > /tmp/side-source-plan.json
      - run: legacybox plan manifests/gen7-smoke.json > /tmp/plan.json
      - run: legacybox audit manifests/gen7-smoke.json
      - name: Confirm strict legality gate currently fails closed
        run: |
          set +e
          legacybox audit manifests/gen7-smoke.json --require-legality
          code=$?
          set -e
          test "$code" -eq 3


  pkhex-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kwsch/PKHeX
          ref: master
          path: external/PKHeX
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build helpers/pkhex-validator/LegacyBox.PKHeXValidator.csproj --configuration Release
      - run: dotnet build helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj --configuration Release
      - run: dotnet build helpers/pkhex-batch/LegacyBox.BatchGenerator.csproj --configuration Release
      - name: Confirm PKHeX catalog finds Red VC Venusaur origin
        run: |
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 3 RD > /tmp/venusaur-red.json
          cat /tmp/venusaur-red.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/venusaur-red.json"))
          assert data["requestedSpecies"] == 3
          assert data["requestedVersion"] == "RD"
          assert data["count"] > 0
          assert any(e["species"] == 1 and e["levelMin"] == 5 for e in data["encounters"]), data
          PY
      - name: Confirm PKHeX catalog resolves Blue VC Charizard to Charmander
        run: |
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 6 GN > /tmp/charizard-blue.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/charizard-blue.json"))
          assert data["requestedSpecies"] == 6
          assert data["count"] > 0
          assert any(
              e["species"] == 4
              and e["levelMin"] == 5
              and e["ability"] == "OnlyHidden"
              and e["fixedBall"] == "Poke"
              for e in data["encounters"]
          ), data
          PY
      - name: Confirm PKHeX canonical Blastoise origin resolves to Squirtle
        run: |
          # PKHeX canonicalizes the equivalent Yellow Lv.10 Squirtle gift to the
          # shared RBY Lv.5 static template. Historical Yellow provenance remains
          # in the LegacyBox manifest and is applied during VC->Gen VII conversion.
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 9 RD > /tmp/blastoise-canonical.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/blastoise-canonical.json"))
          assert data["requestedSpecies"] == 9
          assert data["count"] > 0
          assert any(
              e["species"] == 7
              and e["levelMin"] == 5
              and e["ability"] == "OnlyHidden"
              and e["fixedBall"] == "Poke"
              for e in data["encounters"]
          ), data
          PY
      - name: Confirm PKHeX catalog exposes Pokéwalker
        run: |
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 25 HG > /tmp/pikachu-hg.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/pikachu-hg.json"))
          assert any(e["type"] == "EncounterStatic4Pokewalker" for e in data["encounters"]), data
          PY
      - name: Confirm PKHeX catalog exposes Dream World
        run: |
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 60 B > /tmp/poliwag-b.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/poliwag-b.json"))
          assert any("Entree" in e["type"] for e in data["encounters"]), data
          PY
      - name: Confirm PKHeX catalog exposes Dream Radar
        run: |
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 641 B2 > /tmp/tornadus-b2.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/tornadus-b2.json"))
          assert any(e["type"] == "EncounterStatic5Radar" for e in data["encounters"]), data
          PY
      - name: Generate Kanto #010-#018 encounter candidates
        run: |
          mkdir -p /tmp/legacybox-candidates
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 10-18 RD > /tmp/legacybox-candidates/kanto-010-018-red-vc.json
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 10-18 GN > /tmp/legacybox-candidates/kanto-010-018-blue-vc.json
          dotnet run --no-build --configuration Release --project helpers/pkhex-catalog/LegacyBox.EncounterCatalog.csproj -- 10-18 YW > /tmp/legacybox-candidates/kanto-010-018-yellow-vc.json
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("/tmp/legacybox-candidates").glob("*.json"))
          assert len(files) == 3
          covered = set()
          for path in files:
              data = json.loads(path.read_text())
              assert len(data["results"]) == 9
              for result in data["results"]:
                  if result["count"] > 0:
                      covered.add(result["requestedSpecies"])
          assert covered == set(range(10, 19)), covered
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kanto-010-018-encounter-candidates
          path: /tmp/legacybox-candidates/*.json
      - name: Generate and validate LegacyBox #001-#009 batch
        run: |
          rm -rf /tmp/legacybox-batch-001-009
          mkdir -p /tmp/legacybox-batch-001-009
          dotnet run --no-build --configuration Release --project helpers/pkhex-batch/LegacyBox.BatchGenerator.csproj -- manifests/heritage-001-009.json /tmp/legacybox-batch-001-009
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/legacybox-batch-001-009")
          report = json.loads((root / "batch-report.json").read_text())
          assert report["total"] == 9, report
          assert report["passed"] == 9, report
          assert report["failed"] == 0, report
          assert report["allLegal"] is True, report
          assert len(list(root.glob("*.pk7"))) == 9
          assert all(r["ot"] == "Doug" for r in report["results"]), report
          assert all(r["legal"] for r in report["results"]), report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacybox-batch-001-009
          path: /tmp/legacybox-batch-001-009/*
          if-no-files-found: warn
      - name: Check device RNG exports through real PKHeX generation
        run: |
          PYTHONPATH=tests python - <<'PY'
          import json
          from pathlib import Path
          from test_device_rng import export_request, r
          request=Path('/tmp/device-request.tsv')
          export_request(request)
          manifest=r.resolve_request(request,Path('manifests/heritage-001-009.json'))
          Path('/tmp/device-manifest.json').write_text(json.dumps(manifest))
          PY
          dotnet run --no-build --configuration Release --project helpers/pkhex-batch/LegacyBox.BatchGenerator.csproj -- /tmp/device-manifest.json /tmp/device-batch
          python - <<'PY'
          import json
          manifest=json.load(open('/tmp/device-manifest.json'))
          report=json.load(open('/tmp/device-batch/batch-report.json'))
          assert report['allLegal'] and report['passed']==9 and report['failed']==0, report
          for entry, result in zip(manifest['entries'],report['results']):
              rolls=entry['device_rolls']; packed=int(rolls['ivs_hex'],16)
              assert result['encryptionConstantHex']==rolls['ec_hex'], result
              assert result['attemptsUsed']==rolls['search_attempts'], result
              assert result['hostConversions']==1, result
              assert result['deviceBestAttempt']==rolls['best_attempt'], result
              assert result['deviceProfileHash']==rolls['profile_hash'], result
              assert result['rngAlgorithm']=='LBX-DEVICE-SEARCH-1/SplitMix64', result
              hp_types='Fighting Flying Poison Ground Rock Bug Ghost Steel Fire Water Grass Electric Psychic Ice Dragon Dark'.split()
              bits=sum(((packed>>(i*5))&1)<<i for i in range(6))
              assert result['hiddenPower']==hp_types[bits*15//63], result
              for i,key in enumerate(('HP','Atk','Def','Spe','SpA','SpD')):
                  assert result['actualIVs'][key]==(packed>>(i*5))&31, result
          PY
      - name: Confirm malformed PKM fails closed
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("/tmp/bad.pk7").write_bytes(b"not a pokemon")
          PY
          set +e
          dotnet run --no-build --configuration Release --project helpers/pkhex-validator/LegacyBox.PKHeXValidator.csproj -- /tmp/bad.pk7
          code=$?
          set -e
          test "$code" -eq 2


  legacybox-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Build LegacyBox3DS
        run: make -C 3ds/LegacyBox3DS -j$(nproc --all)
      - name: Verify build products
        run: |
          test -f 3ds/LegacyBox3DS/LegacyBox3DS.3dsx
          test -f 3ds/LegacyBox3DS/LegacyBox3DS.smdh
      - uses: actions/upload-artifact@v4
        with:
          name: LegacyBox3DS
          path: |
            3ds/LegacyBox3DS/LegacyBox3DS.3dsx
            3ds/LegacyBox3DS/LegacyBox3DS.smdh


  sprite-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: msikma/pokesprite
          ref: c5aaa610ff2acdf7fd8e2dccd181bca8be9fcb3e
          path: external/pokesprite
          sparse-checkout: |
            data/pokemon.json
            icons/pokemon/regular
            icons/pokemon/shiny
            LICENSE
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==11.3.0
      - name: Build all 807 regular and shiny catalog icons
        run: python scripts/build_sprite_pack.py external/pokesprite /tmp/legacybox-assets
      - uses: actions/upload-artifact@v4
        with:
          name: LegacyBox-sprite-assets
          path: /tmp/legacybox-assets/*
