name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: legacybox plan manifests/gen7-smoke.json > /tmp/plan.json
      - run: legacybox audit manifests/gen7-smoke.json
      - name: Confirm strict legality gate currently fails closed
        run: |
          set +e
          legacybox audit manifests/gen7-smoke.json --require-legality
          code=$?
          set -e
          test "$code" -eq 3
