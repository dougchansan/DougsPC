[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacybox"
version = "0.1.0"
description = "Preservation-first Pokémon save migration toolkit"
requires-python = ">=3.11"

[project.scripts]
legacybox = "legacybox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
